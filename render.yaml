services:
  # Backend - API + Socket.IO signaling server
  - type: web
    name: hear-this-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CORS_ORIGIN
        sync: false
        value: https://your-project.vercel.app
      - key: ICE_SERVERS
        value: '[{"urls":"stun:stun.l.google.com:19302"},{"urls":"stun:stun1.l.google.com:19302"}]'
      - key: ROOM_EXPIRATION_MS
        value: 900000
