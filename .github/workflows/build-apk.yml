name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Copy Vector Icon Fonts
        run: |
          mkdir -p mobile/android/app/src/main/assets/fonts
          cp -f mobile/node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts/*.ttf mobile/android/app/src/main/assets/fonts/ || true

      - name: Generate Debug Keystore for APK Signing
        run: |
          mkdir -p mobile/android/app
          keytool -genkey -v \
            -keystore mobile/android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Android Release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hear-this-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
